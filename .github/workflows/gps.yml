name: GPS Update

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-gps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch GPS from RMS
        env:
          RMS_API_KEY: ${{ secrets.RMS_API_KEY }}
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer $RMS_API_KEY" -H "Accept: application/json" "https://rms.teltonika-networks.com/api/devices/1868187")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)
          echo "HTTP: $HTTP_CODE"
          echo "Body: $BODY"
          echo "Body completo: $BODY"
          if [ "$HTTP_CODE" = "200" ]; then
            LAT=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('data',{}).get('gps_latitude',''))")
            LON=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('data',{}).get('gps_longitude',''))")
            SAT=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('data',{}).get('gps_satellites','0'))")
            ACC=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('data',{}).get('gps_accuracy','0'))")
            TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            echo "{\"lat\":$LAT,\"lon\":$LON,\"satellites\":$SAT,\"accuracy\":$ACC,\"timestamp\":\"$TIMESTAMP\",\"source\":\"rms\"}" > gps.json
            echo "GPS guardado: $LAT, $LON"
          else
            echo "Error HTTP $HTTP_CODE"
            [ ! -f gps.json ] && echo "{\"lat\":null,\"lon\":null,\"satellites\":0,\"accuracy\":0,\"timestamp\":null,\"source\":\"error\"}" > gps.json
          fi

      - name: Commit gps.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gps.json
          git diff --staged --quiet || git commit -m "GPS update"
          git push
