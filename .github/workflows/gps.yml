name: GPS Update

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-gps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch GPS from RMS
        run: |
          BODY=$(curl -s -H "Authorization: Bearer ${{ secrets.RMS_API_KEY }}" -H "Accept: application/json" "https://rms.teltonika-networks.com/api/devices/1868187")
          echo "HTTP OK"
          RMS_BODY="$BODY" python3 fetch_gps.py

      - name: Commit gps.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gps.json
          git diff --staged --quiet || git commit -m "GPS update"
          git push
