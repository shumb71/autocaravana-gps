name: GPS Update

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-gps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch GPS from RMS
        env:
          RMS_API_KEY: ${{ secrets.RMS_API_KEY }}
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer $RMS_API_KEY" -H "Accept: application/json" "https://rms.teltonika-networks.com/api/devices/1868187")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)
          echo "HTTP: $HTTP_CODE"
          echo "Body: $BODY"
          echo "Body completo: $BODY"
         if [ "$HTTP_CODE" = "200" ]; then
            LAT=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['data']['latitude'])")
            LON=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['data']['longitude'])")
            SAT=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['data']['satellites'])")
            ACC=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['data']['accuracy'])")
            ALT=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['data']['altitude'])")
            SPD=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['data']['speed'])")
            CRS=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['data']['course'])")
            TMP=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['data']['temperature'])")
            OPR=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['data']['operator'])")
            SIG=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['data']['signal'])")
            TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            echo "{\"lat\":$LAT,\"lon\":$LON,\"satellites\":$SAT,\"accuracy\":$ACC,\"altitude\":$ALT,\"speed\":$SPD,\"heading\":$CRS,\"temperature\":$TMP,\"operator\":\"$OPR\",\"signal\":$SIG,\"timestamp\":\"$TIMESTAMP\",\"source\":\"rms\"}" > gps.json
            echo "GPS guardado: $LAT, $LON"
          fi
      - name: Commit gps.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gps.json
          git diff --staged --quiet || git commit -m "GPS update"
          git push
