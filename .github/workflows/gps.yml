name: GPS Update

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-gps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch GPS from RMS
        env:
          RMS_API_KEY: ${{ secrets.RMS_API_KEY }}
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer $RMS_API_KEY" -H "Accept: application/json" "https://rms.teltonika-networks.com/api/devices/1868187")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)
          echo "HTTP: $HTTP_CODE"
          echo "Body: $BODY"
          echo "Body completo: $BODY"
         if [ "$HTTP_CODE" = "200" ]; then
           printf '{"lat":%s,"lon":%s,"satellites":%s,"accuracy":%s,"altitude":%s,"speed":%s,"heading":%s,"temperature":%s,"operator":"%s","signal":%s,"timestamp":"%s","source":"rms"}\n' "$LAT" "$LON" "$SAT" "$ACC" "$ALT" "$SPD" "$CRS" "$TMP" "$OPR" "$SIG" "$TIMESTAMP" > gps.json
          fi
      - name: Commit gps.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gps.json
          git diff --staged --quiet || git commit -m "GPS update"
          git push
